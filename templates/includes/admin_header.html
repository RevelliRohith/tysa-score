{% load static %}
<!-- Top Championship & Action Bar for Admin matching Reference UI -->
<header class="h-16 bg-white border-b border-slate-200/90 px-6 sm:px-8 flex items-center justify-between shrink-0 sticky top-0 z-20">
    <!-- Left: Toggle & Championship Selector -->
    <div class="flex items-center space-x-4">
        <button type="button" class="text-slate-400 hover:text-slate-600 transition md:hidden">
            <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <div class="relative">
            <button type="button" onclick="document.getElementById('baseAdminChampDropdown').classList.toggle('hidden')" 
                    class="flex items-center space-x-2 px-3.5 py-1.5 bg-slate-50 border border-slate-200/80 rounded-xl text-xs font-bold text-slate-800 hover:bg-slate-100 transition shadow-2xs">
                <i data-lucide="trophy" class="w-3.5 h-3.5 text-amber-500"></i>
                <span>{{ active_championship.name|default:"Telangana State Championship 2026" }}</span>
                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
            </button>

            <!-- Championship Dropdown -->
            <div id="baseAdminChampDropdown" class="hidden absolute top-10 left-0 w-80 bg-white border border-slate-200 rounded-2xl shadow-xl z-50 py-2 divide-y divide-slate-100">
                <div class="px-4 py-2 text-[10px] font-black uppercase tracking-wider text-slate-400">
                    Authorized Championships
                </div>
                <div class="max-h-60 overflow-y-auto py-1">
                    {% for c in all_championships %}
                    <a href="{% url 'championship_switch' champ_id=c.id %}" 
                        class="flex items-center justify-between px-4 py-2 text-xs hover:bg-slate-50 transition {% if active_championship.id == c.id %}bg-teal-50/50 font-bold text-teal-800{% else %}text-slate-700{% endif %}">
                        <span class="truncate">{{ c.name }} ({{ c.year }})</span>
                        {% if active_championship.id == c.id %}
                        <span class="w-1.5 h-1.5 rounded-full bg-teal-600 shrink-0"></span>
                        {% endif %}
                    </a>
                    {% empty %}
                    <div class="px-4 py-2 text-xs text-slate-400">Telangana State Championship 2026</div>
                    {% endfor %}
                </div>
                <div class="p-2 space-y-1 bg-slate-50/50">
                    <a href="{% url 'championship_create' %}" class="flex items-center space-x-2 px-3 py-1.5 text-xs font-bold text-teal-700 hover:bg-teal-50 rounded-xl transition">
                        <i data-lucide="plus-circle" class="w-3.5 h-3.5 text-teal-600"></i>
                        <span>Create Championship</span>
                    </a>
                    <a href="{% url 'championship_list' %}" class="flex items-center space-x-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        <i data-lucide="layers" class="w-3.5 h-3.5 text-slate-500"></i>
                        <span>View All Championships</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Right: Quick Live Views, Notifications & System Admin Avatar -->
    <div class="flex items-center space-x-3">
        <a href="{% url 'public_live_display' %}" target="_blank" class="hidden sm:inline-flex items-center px-3 py-1.5 text-xs font-semibold text-teal-700 bg-teal-50 hover:bg-teal-100 rounded-xl border border-teal-200 transition">
            <i data-lucide="tv" class="w-3.5 h-3.5 mr-1.5"></i> Live Display
        </a>
        <a href="{% url 'second_screen' %}" target="_blank" class="hidden sm:inline-flex items-center px-3 py-1.5 text-xs font-semibold text-slate-600 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 transition">
            <i data-lucide="monitor" class="w-3.5 h-3.5 mr-1.5"></i> 2nd Screen
        </a>
        <button type="button" class="relative p-2 text-slate-400 hover:text-slate-600 transition rounded-xl hover:bg-slate-50">
            <i data-lucide="bell" class="w-4 h-4"></i>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-teal-500 rounded-full"></span>
        </button>
        <div class="flex items-center space-x-2.5 pl-3 border-l border-slate-200">
            <div class="w-8 h-8 rounded-full bg-[#1a365d] text-white flex items-center justify-center font-bold text-xs shadow-2xs">
                SA
            </div>
            <span class="text-xs font-bold text-slate-800 hidden sm:inline">System Admin</span>
        </div>
    </div>
</header>
