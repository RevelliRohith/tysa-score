services:
  db:
    image: postgres:16-alpine
    container_name: tysa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tysa_db
      POSTGRES_USER: tysa_user
      POSTGRES_PASSWORD: tysa_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tysa_user -d tysa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tysa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: tysa_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py import_asanas &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=tysa-prod-secret-key-replace-in-env-file-minimum-50-characters
      - ALLOWED_HOSTS=*
      - DATABASE_URL=postgresql://tysa_user:tysa_password@db:5432/tysa_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media

  celery:
    build: .
    container_name: tysa_celery
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=tysa-prod-secret-key-replace-in-env-file-minimum-50-characters
      - DATABASE_URL=postgresql://tysa_user:tysa_password@db:5432/tysa_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media

volumes:
  postgres_data:
  static_volume:
  media_volume:
